<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StyleGAN CelebA Face Studio — Experiment 7</title>
  <style>
    :root {
      --bg: #0d0f14;
      --card: #151821;
      --card-hover: #1c212d;
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 32px 24px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .title-group h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.15);
      color: var(--accent);
      border: 1px solid rgba(167, 139, 250, 0.3);
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }
    .filters {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0d0f14;
      font-weight: 700;
      border-color: var(--accent);
    }
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px var(--accent-glow);
      border-color: rgba(167, 139, 250, 0.4);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #08090c;
    }
    .card-info {
      padding: 14px 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .card-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal.open { display: flex; }
    .modal-content {
      max-width: 900px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal-img-wrap {
      background: #000;
      text-align: center;
      max-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-img-wrap img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    .modal-footer {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>StyleGAN CelebA Studio <span class="badge">Exp 7</span></h1>
      <p class="subtitle">Mapping Network Z → W · AdaIN Style Injection · Truncation Trick · Style Mixing</p>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterGallery('all', this)">All Results ({{ images|length }})</button>
    <button class="filter-btn" onclick="filterGallery('epoch', this)">Training Progression ({{ epoch_images|length }})</button>
    <button class="filter-btn" onclick="filterGallery('vis', this)">StyleGAN Visualizations ({{ vis_images|length }})</button>
  </div>

  <div class="gallery" id="gallery">
    {% for item in images %}
    <div class="card" data-category="{{ 'epoch' if item.name.startswith('epoch_') else 'vis' }}" onclick="openModal('{{ url_for('serve_result', filename=item.name) }}', '{{ item.title }}')">
      <img src="{{ url_for('serve_result', filename=item.name) }}" alt="{{ item.title }}" loading="lazy">
      <div class="card-info">
        <div class="card-title">{{ item.title }}</div>
        <div class="card-desc">{{ item.description }}</div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="modal" id="modal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <div class="modal-img-wrap">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-footer">
        <div>
          <strong id="modal-title" style="font-size: 15px;"></strong>
        </div>
        <button class="close-btn" onclick="closeModal()">Close (Esc)</button>
      </div>
    </div>
  </div>

  <script>
    function filterGallery(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.card').forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openModal(src, title) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
